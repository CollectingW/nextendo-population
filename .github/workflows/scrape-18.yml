name: Scrape population (18:07 UTC)

on:
  schedule:
    - cron: "7 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scraper
        run: python3 scripts/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "nextendo-population-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/population.json
          git diff --cached --quiet && exit 0
          git commit -m "Update population data (18:07 UTC)"
          git pull --rebase origin main
          git push
